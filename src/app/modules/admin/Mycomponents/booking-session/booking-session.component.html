<div style="background-color: #f6cfcf;">
<input
type="date"
style="margin-top: 13vh; align-items: center; margin-left: 42%;"
[(ngModel)]="selectedDate"
value="{{ selectedDate }}"
(change)="onDateChange(person.id)"
/>
<form class="form" id="form1">
<h2 style="text-align: center;">Booking Session</h2>
<br>
<p id="Date" name="text" style="text-align: center; font-size: 22px;">Date :  {{   selectedDate }}</p>

<br>
<h2 style="text-align: center;">Available Time Slots:</h2>
<ul>
<li *ngFor="let slot of availableTimeSlots" style="margin-left: 45%;">
  <input type="radio" name="date" id="date" value="date"  (click)="selectSlot(slot)">
<label for="date" >{{ slot.time}}</label><br>
</li>
</ul>


  <h4 style="text-align: center; margin-top: 2%">
    Please add at least 3 lines of description of what you would like to discuss
    during conversation
  </h4>
  <p class="text">
    <textarea
      name="text"
      class="validate[required,length[6,300]] feedback-input"
      id="comment"
      placeholder="Comment"
    ></textarea>
  </p>

  <!-- payment detail card  -->
  <div class="card">
    <img
      src="{{'data:image/jpeg;base64,'+person.profile_pic}}"
      alt="Image"
    />
    <div class="card-content">
      <h2>Session details</h2>
      <p>Mentor Name: {{ person.name }}</p>
      <p>Date and Time : {{selectedSlot}}</p>
      <p>Total Amount :</p>
    </div>
  </div>
  <!-- end of payment card  -->

  <!-- <div class="submit">
        <input type="submit" value="SEND" id="button-blue" />
        <div class="ease"></div>
      </div> -->

  <div class="button-container">
    <button type="submit" (click)="startBookingProcess()" style="margin-bottom: 2%">Book Appointment</button>
  </div>
</form>

</div>
