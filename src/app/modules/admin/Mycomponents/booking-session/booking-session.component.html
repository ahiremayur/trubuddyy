
<input
type="date"
style="margin-top: 18%"
[(ngModel)]="selectedDate"
value="{{ selectedDate }}"
(change)="onDateChange(person.id)"
/>

<h2>Booking Session</h2>
Date:
<p id="Date" name="text">{{ selectedDate }}</p>


<h2>Available Time Slots:</h2>
<ul>
<li *ngFor="let slot of availableTimeSlots">
  <input type="radio" name="date" id="date" value="date" (click)="selectSlot(slot)">
<label for="date">{{ slot.time}}</label><br>
</li>
</ul>

<form class="form" id="form1">


  <h4 style="text-align: center; margin-top: 8%">
    Please add at least 3 lines of description of what you would like to discuss
    during conversation
  </h4>
  <p class="text">
    <textarea
      name="text"
      class="validate[required,length[6,300]] feedback-input"
      id="comment"
      placeholder="Comment"
    ></textarea>
  </p>
