    <div class="card1" style="font-size: 20px">
      <h4 style="font-family: Gilroy,-apple-system,BlinkMacSystemFont,Oxygen,Ubuntu,Cantarell,Fira Sans,Droid Sans,Helvetica Neue,Arial,sans-serif!important;">Reach Out</h4>
      <p style="font-family: Gilroy,-apple-system,BlinkMacSystemFont,Oxygen,Ubuntu,Cantarell,Fira Sans,Droid Sans,Helvetica Neue,Arial,sans-serif!important; margin-top: 5%;">
       <b> +91 9022808748<br />
        support@trubuddyy.com</b>
      </p>
    </div>
    <div class="card2" style="font-size: 20px">
      <h4 style="font-family: Gilroy,-apple-system,BlinkMacSystemFont,Oxygen,Ubuntu,Cantarell,Fira Sans,Droid Sans,Helvetica Neue,Arial,sans-serif!important;">Address</h4>
      <p style="font-family: Gilroy,-apple-system,BlinkMacSystemFont,Oxygen,Ubuntu,Cantarell,Fira Sans,Droid Sans,Helvetica Neue,Arial,sans-serif!important; margin-top: 5%;"><b>WeWork Enam Sambhav <br> C-20 G Block BKC Mumbai</b></p>
    </div>
  </div>
  <p style="font-family: Gilroy,-apple-system,BlinkMacSystemFont,Oxygen,Ubuntu,Cantarell,Fira Sans,Droid Sans,Helvetica Neue,Arial,sans-serif!important; font-size: 52px;   margin-left: 10%;">Get In Touch</p>
  <div class="container">
    <div class="row mx-auto">
        <div class="card customStyle-card-form">
          <div class="card-body">
            <h5 class="card-title customStyle-card-title-form"><i class="bi bi-person"></i> Contact</h5>
            
              <form class="row g-3 needs-validation" onsubmit="validateForm()" name="contactForm">
                
                <div class="col-md-6">
                  <!-- <label for="validationCustom01" class="form-label">Full Name</label> -->
                  <input name="fullName" type="text" id="fullNameForm" class="form-control" value="" placeholder="Full Name" style="border: 1px solid black;" required autocomplete="off">
               </div>
                
               <div class="col-md-6">
                 <!-- <label for="validationCustom02" class="form-label">Phone</label> -->
                 <div class="input-group has-validation">
                    <!-- <span class="input-group-text" id="inputGroupPrepend"></span> -->
                    <input name="phone" type="text" id="phoneForm" class="form-control" aria-describedby="inputGroupPrepend" placeholder="Phone Number"  style="border: 1px solid black;" required autocomplete="off">
                 </div>
               </div>
               <br>
                
                <div class="col-md-12">
                  <!-- <label for="validationCustomUsername" class="form-label">Email</label> -->
                  <div class="input-group has-validation">
                    <!-- <span class="input-group-text" id="inputGroupPrepend"></span> -->
                    <input name="email" type="text" id="emailForm" class="form-control" aria-describedby="inputGroupPrepend" placeholder="Email Address"  style="border: 1px solid black;" required autocomplete="off">
                  </div>
                </div>
                
                <div class="col-md-12">
                  <!-- <label for="validationCustom03" class="form-label">Message</label> -->
                  <textarea type="text" class="form-control" placeholder="Message" style="border: 1px solid black;" required autocomplete="off"></textarea>
                </div>
                
                <div class="col-12">
                  <button class="btn btn-primary customStyle-btn-primary" type="submit" ><i class="bi bi-send-fill"></i> Send </button>
                </div>
                
              </form>
            
          </div>
      </div>
    </div>
  </div>
</div>
